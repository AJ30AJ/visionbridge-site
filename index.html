  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

fg:        #f5f6f8;\n    --fg-dim:    #a8aab3;\n    --fg-mute:   #6b6e79;\n    --cyan:      #00D4FF;\n    --cyan-2:    #00B4FF;\n    --cyan-soft: rgba(0,212,255,0.14);\n    --maxw:      1240px;\n    --pad:       28px;\n  }\n  * { box-sizing: border-box; }\n  html, body { margin:0; padding:0; background: var(--bg); color: var(--fg);\n    font-family: 'Archivo', system-ui, sans-serif; -webkit-font-smoothing: antialiased;\n    text-rendering: optimizeLegibility; font-stretch: 100%; }\n  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }\n  body { overflow-x: hidden; }\n  a { color: inherit; text-decoration: none; }\n  img { display:block; max-width: 100%; }\n\n  /* ---------- Background atmosphere ---------- */\n  .bg-grain {\n    position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.5;\n    background-image:\n      radial-gradient(1200px 600px at 80% -10%, rgba(0,180,255,0.10), transparent 60%),\n      radial-gradient(900px 500px at -10% 30%, rgba(0,212,255,0.06), transparent 60%);\n  }\n  .bg-grid {\n    position: fixed; inset: 0; pointer-events: none; z-index: 0;\n    background-image:\n      linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),\n      linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);\n    background-size: 64px 64px;\n    mask-image: radial-gradient(ellipse at 50% 0%, black 30%, transparent 75%);\n  }\n\n  /* ---------- Nav ---------- */\n  .nav {\n    position: fixed; top: 0; left: 0; right: 0; z-index: 50;\n    backdrop-filter: blur(14px) saturate(140%);\n    -webkit-backdrop-filter: blur(14px) saturate(140%);\n    background: rgba(7,7,11,0.55);\n    border-bottom: 1px solid transparent;\n    transition: border-color .3s ease, background .3s ease;\n  }\n  .nav.is-scrolled { border-bottom-color: var(--line); background: rgba(7,7,11,0.78); }\n  .nav-inner {\n    max-width: var(--maxw); margin: 0 auto; padding: 18px var(--pad);\n    display: flex; align-items: center; justify-content: space-between; gap: 24px;\n  }\n  .logo { display: flex; align-items: center; gap: 14px; }\n  .logo-img { height: 40px; width: auto; display: block; filter: drop-shadow(0 0 0 transparent); }\n  .nav-links {\n    display: flex; gap: 4px; align-items: center;\n  }\n  .nav-links a {\n    padding: 8px 14px; font-size: 12px; font-weight: 500; color: var(--fg-dim);\n    letter-spacing: 0.02em;\n    border-radius: 999px; transition: color .2s ease, background .2s ease;\n  }\n  .nav-links a:hover { color: var(--fg); background: rgba(255,255,255,0.04); }\n  .nav-cta {\n    margin-left: 8px; padding: 8px 14px; font-size: 12px; font-weight: 600;\n    letter-spacing: 0.04em; text-transform: uppercase;\n    border: 1px solid var(--line-2); border-radius: 999px; color: var(--fg);\n  }\n  .nav-cta:hover { border-color: var(--cyan); color: var(--cyan); }\n\n  /* ---------- Layout ---------- */\n  main { position: relative; z-index: 1; }\n  section { padding: 96px var(--pad); }\n  .wrap { max-width: var(--maxw); margin: 0 auto; }\n\n  .tag {\n    display: inline-flex; align-items: center; gap: 10px;\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 11px; font-weight: 500; letter-spacing: 0.18em;\n    text-transform: uppercase; color: var(--cyan);\n  }\n  .tag::before {\n    content: \"\"; width: 6px; height: 6px; border-radius: 50%;\n    background: var(--cyan); box-shadow: 0 0 10px var(--cyan);\n  }\n  .tag.muted { color: var(--fg-mute); }\n  .tag.muted::before { background: var(--fg-mute); box-shadow: none; }\n\n  /* ---------- Hero ---------- */\n  .hero { padding-top: 168px; padding-bottom: 120px; position: relative; }\n  .hero-inner { display: grid; grid-template-columns: 1.7fr 1fr; gap: 64px; align-items: end; }\n  .hero h1 {\n    font-size: clamp(56px, 8.4vw, 128px); line-height: 0.92; letter-spacing: -0.045em;\n    font-weight: 800; margin: 26px 0 0 0; text-transform: none;\n  }\n  .hero h1 .line { display: block; white-space: nowrap; }\n  .hero h1 .grad {\n    background: linear-gradient(120deg, #fff 0%, var(--cyan) 55%, var(--cyan-2) 100%);\n    -webkit-background-clip: text; background-clip: text; color: transparent;\n    font-weight: 900;\n  }\n  .hero .sub {\n    color: var(--fg-dim); font-size: 17px; line-height: 1.55; max-width: 42ch;\n    margin-top: 32px; font-weight: 400;\n  }\n  .hero .sub strong { color: var(--fg); font-weight: 600; }\n\n  .hero-right {\n    display: flex; flex-direction: column; gap: 18px; padding-bottom: 6px;\n  }\n  .badge-card {\n    border: 1px solid var(--line);\n    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.0));\n    border-radius: 16px; padding: 22px 22px 20px;\n    position: relative; overflow: hidden;\n  }\n  .badge-card::after {\n    content: \"\"; position: absolute; top:0; left: 0; width: 1px; height: 60%;\n    background: linear-gradient(180deg, var(--cyan), transparent);\n  }\n  .badge-card .row { display:flex; align-items:baseline; gap: 10px; }\n  .badge-card .num {\n    font-size: 64px; font-weight: 800; letter-spacing: -0.05em; line-height: 1;\n    color: #fff;\n  }\n  .badge-card .x { color: var(--cyan); font-size: 20px; font-weight: 500; font-family: 'JetBrains Mono', ui-monospace, monospace; }\n  .badge-card .lbl {\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 11px; font-weight: 500; letter-spacing: 0.16em; color: var(--fg-dim);\n    text-transform: uppercase; margin-top: 14px; line-height: 1.5;\n  }\n  .badge-card .lbl span { color: var(--cyan); }\n\n  .ticker {\n    display: flex; gap: 28px; margin-top: 6px; align-items: center;\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;\n    color: var(--fg-mute); font-weight: 500;\n  }\n  .ticker .dot { width: 4px; height: 4px; background: currentColor; border-radius: 50%; }\n  .ticker .live { color: var(--cyan); }\n  .ticker .live .pulse {\n    display:inline-block; width: 6px; height: 6px; background: var(--cyan);\n    border-radius: 50%; margin-right: 6px; box-shadow: 0 0 10px var(--cyan);\n    animation: pulse 1.6s ease-in-out infinite;\n  }\n  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }\n\n  /* hero divider line */\n  .hero-divider {\n    margin: 80px 0 0; height: 1px; background: var(--line);\n    position: relative; overflow: hidden;\n  }\n  .hero-divider::before {\n    content: \"\"; position: absolute; top: 0; left: 0; height: 100%; width: 120px;\n    background: linear-gradient(90deg, transparent, var(--cyan), transparent);\n    animation: sweep 6s linear infinite;\n  }\n  @keyframes sweep { 0%{transform: translateX(-120px);} 100%{transform: translateX(100vw);} }\n\n  /* ---------- Featured Work ---------- */\n  .section-head {\n    display: flex; align-items: end; justify-content: space-between; gap: 24px;\n    margin-bottom: 40px;\n  }\n  .section-head h2 {\n    font-size: clamp(32px, 3.8vw, 52px); font-weight: 700; letter-spacing: -0.03em;\n    margin: 14px 0 0 0; line-height: 1.02;\n  }\n  .section-head .meta {\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 11px; color: var(--fg-mute); letter-spacing: 0.14em;\n    text-transform: uppercase; padding-bottom: 8px; font-weight: 500;\n  }\n\n  .games {\n    display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;\n  }\n  .game {\n    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;\n    background: var(--surface); transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease;\n    display: flex; flex-direction: column;\n  }\n  .game:hover {\n    transform: translateY(-6px); border-color: rgba(0,212,255,0.55);\n    box-shadow: 0 30px 60px -30px rgba(0,212,255,0.25);\n  }\n  .game-art {\n    position: relative; aspect-ratio: 16/10;\n    background: linear-gradient(135deg, #0c1422 0%, #06070d 100%);\n    overflow: hidden; isolation: isolate;\n  }\n  .game-art .scan {\n    position: absolute; inset: 0;\n    background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 4px);\n    mix-blend-mode: overlay; opacity: 0.6;\n  }\n  .game-art .title {\n    position: absolute; left: 24px; right: 24px; bottom: 22px;\n    font-size: clamp(24px, 2vw, 30px); font-weight: 800; line-height: 0.96;\n    letter-spacing: -0.025em; color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,0.5);\n  }\n  .game-art .title small {\n    display: block; font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 10px; font-weight: 500; letter-spacing: 0.2em;\n    text-transform: uppercase; color: var(--cyan); margin-bottom: 14px; opacity: 0.95;\n  }\n  .game-art .corner {\n    position: absolute; top: 18px; left: 20px;\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 10px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;\n    color: rgba(255,255,255,0.55);\n  }\n  .game-art .ring {\n    position: absolute; inset: 0; pointer-events: none;\n    background:\n      radial-gradient(80% 60% at 20% 100%, rgba(0,180,255,0.22), transparent 60%),\n      radial-gradient(60% 50% at 90% 0%, rgba(0,212,255,0.18), transparent 60%);\n  }\n  .badge-top {\n    position: absolute; top: 16px; right: 16px;\n    display: inline-flex; align-items: center; gap: 6px;\n    padding: 6px 10px; border-radius: 999px;\n    background: rgba(0,212,255,0.14); border: 1px solid rgba(0,212,255,0.45);\n    color: var(--cyan); font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 10px; font-weight: 500; letter-spacing: 0.16em;\n    text-transform: uppercase; backdrop-filter: blur(8px);\n  }\n  .badge-top svg { width: 11px; height: 11px; }\n  .game-info {\n    padding: 20px 22px 22px; display: flex; justify-content: space-between; align-items: center;\n    gap: 16px;\n  }\n  .game-info .studio { font-size: 14px; color: var(--fg); font-weight: 500; letter-spacing: -0.005em; }\n  .game-info .platforms { display: flex; gap: 6px; }\n  .game-info .platform {\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 10px; font-weight: 500; letter-spacing: 0.14em; color: var(--fg-dim);\n    text-transform: uppercase; border: 1px solid var(--line-2); padding: 5px 9px;\n    border-radius: 6px; white-space: nowrap;\n  }\n\n  /* Per-game art treatments */\n  .art-contractors {\n    background:\n      radial-gradient(60% 80% at 70% 30%, #163252 0%, transparent 70%),\n      linear-gradient(160deg, #0a1828 0%, #050609 100%);\n  }\n  .art-nightclub {\n    background:\n      radial-gradient(50% 80% at 30% 80%, #4a0d6b 0%, transparent 65%),\n      radial-gradient(50% 70% at 80% 20%, #122e6b 0%, transparent 65%),\n      linear-gradient(160deg, #0c0820 0%, #050309 100%);\n  }\n  .art-haymaker {\n    background:\n      radial-gradient(60% 70% at 50% 100%, #6e1b1b 0%, transparent 65%),\n      linear-gradient(160deg, #1a0d0d 0%, #06070d 100%);\n  }\n\n  /* ---------- How We Work ---------- */\n  .how {\n    position: relative;\n    margin: 16px var(--pad) 16px;\n  }\n  .how-card {\n    max-width: var(--maxw); margin: 0 auto;\n    border: 1px solid var(--line); border-radius: 24px;\n    background:\n      radial-gradient(1200px 400px at 20% 0%, rgba(0,180,255,0.10), transparent 60%),\n      linear-gradient(180deg, #0b0d14 0%, #08090e 100%);\n    padding: 72px clamp(28px, 5vw, 80px);\n    position: relative; overflow: hidden;\n  }\n  .how-card::before {\n    content: \"\"; position: absolute; top: 0; left: 0; right: 0; height: 1px;\n    background: linear-gradient(90deg, transparent, var(--cyan), transparent);\n    opacity: 0.6;\n  }\n  .how-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 56px; align-items: start; }\n  .how h2 {\n    font-size: clamp(34px, 4vw, 62px); font-weight: 700; line-height: 1.04;\n    letter-spacing: -0.035em; margin: 20px 0 0 0;\n  }\n  .how h2 .hl-line { display: block; white-space: nowrap; }\n  .how h2 .accent {\n    color: var(--cyan); font-weight: 900;\n    display: block; white-space: nowrap;\n    margin-top: 0.4em;\n  }\n  .how p.body {\n    color: var(--fg-dim); font-size: 17px; line-height: 1.62; font-weight: 400;\n    margin: 0;\n  }\n  .how p.body em {\n    color: var(--fg); font-style: normal; font-weight: 600;\n  }\n  .how-stats {\n    margin-top: 36px; display: grid; grid-template-columns: 1fr 1fr; gap: 0;\n    border-top: 1px solid var(--line);\n  }\n  .how-stats div {\n    padding: 22px 0 4px; border-right: 1px solid var(--line);\n  }\n  .how-stats div:last-child { border-right: 0; padding-left: 28px; }\n  .how-stats .k {\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;\n    color: var(--fg-mute); font-weight: 500;\n  }\n  .how-stats .v {\n    font-size: 40px; font-weight: 800; letter-spacing: -0.035em; color: #fff;\n    margin-top: 10px; line-height: 1;\n  }\n  .how-stats .v span { color: var(--cyan); }\n\n  /* ---------- China Market ---------- */\n  .china-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }\n  .china-card {\n    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;\n    background: var(--surface); transition: transform .3s, border-color .3s;\n  }\n  .china-card:hover { transform: translateY(-4px); border-color: var(--line-2); }\n  .china-art {\n    aspect-ratio: 16/9; position: relative; overflow: hidden;\n    background: linear-gradient(135deg, #0a0f1a 0%, #060709 100%);\n  }\n  .china-art .title {\n    position: absolute; inset: 22px; display: flex; flex-direction: column;\n    justify-content: flex-end;\n  }\n  .china-art .title small {\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;\n    color: var(--cyan); font-weight: 500; margin-bottom: 10px;\n  }\n  .china-art .title strong {\n    font-size: 24px; font-weight: 700; letter-spacing: -0.025em;\n  }\n  .china-art .cn-mark {\n    position: absolute; top: 16px; right: 18px;\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 10px; font-weight: 500; letter-spacing: 0.16em;\n    color: rgba(255,255,255,0.4); text-transform: uppercase;\n    display: flex; align-items: center; gap: 8px;\n  }\n  .china-art .cn-mark .sq {\n    width: 8px; height: 8px; background: var(--cyan); border-radius: 1px;\n    box-shadow: 0 0 8px rgba(0,212,255,0.7);\n  }\n  .china-info {\n    padding: 14px 18px 16px; display:flex; justify-content: space-between; align-items: center;\n    border-top: 1px solid var(--line); font-size: 12px;\n  }\n  .china-info .label { color: var(--fg-dim); font-weight: 500; }\n  .china-info .tag-mini {\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    color: var(--fg-mute); letter-spacing: 0.14em; font-size: 10px;\n    text-transform: uppercase;\n  }\n\n  .art-metro { background: radial-gradient(60% 80% at 50% 50%, #1a3d2a 0%, #050709 75%); }\n  .art-breachers { background: radial-gradient(60% 80% at 50% 50%, #2a1f55 0%, #050609 75%); }\n  .art-underdogs { background: radial-gradient(60% 80% at 50% 50%, #6b4a0d 0%, #050609 75%); }\n\n  /* ---------- Contact ---------- */\n  .contact {\n    text-align: center; padding: 140px var(--pad) 120px; position: relative;\n  }\n  .contact h2 {\n    font-size: clamp(48px, 7vw, 104px); font-weight: 800; letter-spacing: -0.045em;\n    line-height: 0.96; margin: 24px 0 24px 0;\n  }\n  .contact h2 .em { color: var(--cyan); font-weight: 900; }\n  .contact p {\n    color: var(--fg-dim); font-size: 18px; max-width: 46ch; margin: 0 auto 40px;\n    font-weight: 300;\n  }\n  .mail-btn {\n    display: inline-flex; align-items: center; gap: 14px;\n    padding: 18px 28px; border: 1px solid var(--line-2); border-radius: 999px;\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 14px; font-weight: 500; letter-spacing: 0.02em;\n    position: relative; overflow: hidden; transition: border-color .3s ease, color .3s ease;\n  }\n  .mail-btn svg { width: 16px; height: 16px; transition: transform .3s ease; }\n  .mail-btn:hover {\n    border-color: var(--cyan); color: var(--cyan);\n    box-shadow: 0 0 0 1px rgba(0,212,255,0.2), 0 20px 60px -20px rgba(0,212,255,0.3);\n  }\n  .mail-btn:hover svg { transform: translate(2px, -2px); }\n  .mail-btn::before {\n    content: \"\"; position: absolute; inset: 0;\n    background: radial-gradient(80px 80px at var(--mx, 50%) var(--my, 50%), rgba(0,212,255,0.18), transparent 60%);\n    opacity: 0; transition: opacity .3s;\n  }\n  .mail-btn:hover::before { opacity: 1; }\n\n  /* ---------- Footer ---------- */\n  footer {\n    border-top: 1px solid var(--line);\n    padding: 28px var(--pad);\n    font-family: 'JetBrains Mono', ui-monospace, monospace;\n    font-size: 11px; color: var(--fg-mute); letter-spacing: 0.08em;\n    text-transform: uppercase;\n  }\n  .foot {\n    max-width: var(--maxw); margin: 0 auto; display: flex; justify-content: space-between;\n    align-items: center; gap: 16px;\n  }\n  .foot .right { color: var(--fg-mute); }\n  .foot a:hover { color: var(--cyan); }\n\n  /* ---------- Reveal animation ---------- */\n  .reveal { opacity: 0; transform: translateY(20px); transition: opacity .9s ease, transform .9s ease; }\n  .reveal.visible { opacity: 1; transform: none; }\n  .reveal.d1 { transition-delay: 0.05s; }\n  .reveal.d2 { transition-delay: 0.15s; }\n  .reveal.d3 { transition-delay: 0.25s; }\n  .reveal.d4 { transition-delay: 0.35s; }\n  .reveal.d5 { transition-delay: 0.45s; }\n\n  /* ---------- Responsive ---------- */\n  @media (max-width: 960px) {\n    section { padding: 72px 22px; }\n    .hero { padding-top: 132px; padding-bottom: 80px; }\n    .hero-inner { grid-template-columns: 1fr; gap: 40px; }\n    .hero h1 .line { white-space: normal; }\n    #china h2 { white-space: normal !important; font-size: clamp(24px, 5vw, 32px) !important; }\n    .how-grid { grid-template-columns: 1fr; gap: 32px; }\n e.com\">hello@visionbridge.com<\u002Fa><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Nav scroll state\n  const nav = document.getElementById('nav');\n  const onScroll = () => {\n    if (window.scrollY > 8) nav.classList.add('is-scrolled');\n    else nav.classList.remove('is-scrolled');\n  };\n  window.addEventListener('scroll', onScroll, { passive: true });\n  onScroll();\n\n  // Reveal on view\n  const io = new IntersectionObserver((entries) => {\n    entries.forEach(e => {\n      if (e.isIntersecting) {\n        e.target.classList.add('visible');\n        io.unobserve(e.target);\n      }\n    });\n  }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n  document.querySelectorAll('.reveal').forEach(el => io.observe(el));\n\n  // Hero elements: reveal immediately on load\n  window.addEventListener('load', () => {\n    document.querySelectorAll('.hero .reveal').forEach(el => el.classList.add('visible'));\n  });\n\n  // Mail button: cursor glow\n  const mb = document.getElementById('mailBtn');\n  if (mb) {\n    mb.addEventListener('mousemove', (e) => {\n      const r = mb.getBoundingClientRect();\n      mb.style.setProperty('--mx', (e.clientX - r.left) + 'px');\n      mb.style.setProperty('--my', (e.clientY - r.top) + 'px');\n    });\n  }\n\n  // Smooth scroll for anchors\n  document.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n    a.addEventListener('click', (e) => {\n      const id = a.getAttribute('href');\n      if (id.length > 1) {\n        const el = document.querySelector(id);\n        if (el) {\n          e.preventDefault();\n          window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 70, behavior: 'smooth' });\n        }\n      }\n    });\n  });\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
